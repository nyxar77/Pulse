Categories:
  - Sports & Health
License: GPL-3.0-only
AuthorName: nyxar77
SourceCode: https://github.com/nyxar77/Pulse
IssueTracker: https://github.com/nyxar77/Pulse/issues
Changelog: https://github.com/nyxar77/Pulse/releases

AutoName: Pulse

RepoType: git
Repo: https://github.com/nyxar77/Pulse.git

Builds:
  - versionName: 0.1.2
    versionCode: 3
    commit: 0.1.2
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky golang-go make nodejs npm
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-java-alternatives -s java-1.21.0-openjdk-amd64
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - esbuild@v0.28.1
    prebuild:
      - cd ../..
      - npm ci
      - rm node_modules/@capacitor/cli/assets/android-template.tar.gz
      - rm node_modules/@capacitor/cli/assets/capacitor-cordova-ios-plugins.tar.gz
      - rm node_modules/@capacitor/cli/assets/ios-pods-template.tar.gz
      - rm node_modules/@capacitor/cli/assets/ios-spm-template.tar.gz
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules/
    build:
      - pushd $$esbuild$$
      - make esbuild
      - popd
      - cp $$esbuild$$/esbuild ../../node_modules/esbuild/bin/esbuild
      - cp $$esbuild$$/esbuild ../../node_modules/@esbuild/linux-x64/bin/esbuild
      - pushd ../..
      - npm run build
      - npx cap sync android
      - popd

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.2
CurrentVersionCode: 3
