name: Bug
description: Something is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Tap…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Web browser
        - Both
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pulse version
      placeholder: 0.1.5

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or device details if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue before opening this one.
          required: true
